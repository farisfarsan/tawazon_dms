<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a Receipt — Tawazon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #f1f5f9; color: #0f172a;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.10); width: 100%; max-width: 440px; overflow: hidden; }
  .hdr { padding: 22px 26px; background: #1e3a8a; color: white; }
  .hdr h1 { font-size: 17px; font-weight: 800; }
  .hdr p { font-size: 12.5px; opacity: 0.9; margin-top: 3px; }
  .body { padding: 24px 26px; }
  label { display: block; font-size: 11.5px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin: 14px 0 5px; }
  input { width: 100%; padding: 11px 13px; border: 1.5px solid #e2e8f0; border-radius: 9px; font-size: 14px; font-family: inherit; outline: none; }
  input:focus { border-color: #1e3a8a; }
  button { width: 100%; margin-top: 20px; background: #1e3a8a; color: white; border: none; padding: 12px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:hover { background: #172a63; }
  .err { background: #fee2e2; color: #b91c1c; border-radius: 8px; padding: 10px 13px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .foot { padding: 0 26px 20px; font-size: 11.5px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <h1>Verify a Tawazon Receipt</h1>
    <p>Enter the receipt number and the CODE printed under the QR code.</p>
  </div>
  <div class="body">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="get">
      <label>Receipt No.</label>
      <input type="text" name="receipt_no" value="{{ receipt_no }}" placeholder="TWZ/RPT/2026/0001" autocomplete="off" required>
      <label>Verification Code</label>
      <input type="text" name="code" placeholder="XXXXX-XXXXX" autocomplete="off" required>
      <button type="submit">Verify</button>
    </form>
  </div>
  <div class="foot">Tawazon Collection Management &middot; tawazonoman.com</div>
</div>
</body>
</html>
